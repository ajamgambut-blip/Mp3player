    <!DOCTYPE html>
    <html lang="id">
    <head><meta charset="UTF-8"><title>MP3 Player</title>
    <style>body{font-family:sans-serif;padding:20px;background:#111;color:white}#searchInput{width:300px;padding:10px}#searchBtn{padding:10px}.song{display:flex;margin:10px 0;background:#222;padding:10px;border-radius:8px}.song img{width:120px;margin-right:10px}button{margin:5px;padding:8px;cursor:pointer}</style>
    </head>
    <body>
    <h1>🎵 MP3 Player</h1>
    <input type="text" id="searchInput" placeholder="Cari lagu...">
    <button id="searchBtn">Search</button>
    <div id="results"></div>
    <div id="player" style="display:none;margin-top:20px;"><h3 id="songTitle"></h3><iframe id="audio" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe></div>

    <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsDiv = document.getElementById('results');
    const player = document.getElementById('player');
    const audio = document.getElementById('audio');
    const songTitle = document.getElementById('songTitle');

    const API_KEY = 'AIzaSyCEpXXPWfTLuhrESQ_XxVz2uiPpA5FJ5XA'; // KEY KAMU

    searchBtn.onclick = searchVideos;
    searchInput.onkeypress = (e) => { if(e.key === 'Enter') searchVideos(); };

    async function searchVideos() {
      const query = searchInput.value;
      if(!query) return alert('Isi dulu');
      resultsDiv.innerHTML = 'Loading...';
      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&key=${API_KEY}&type=video`;
        const res = await fetch(url);
        const data = await res.json();
        if(data.error){ resultsDiv.innerHTML = 'Error API: ' + data.error.message; return; }
        resultsDiv.innerHTML = '';
        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title.replace(/"/g, '&quot;');
          const thumb = item.snippet.thumbnails.medium.url;
          resultsDiv.innerHTML += `<div class="song"><img src="${thumb}"><div><p><b>${title}</b></p><button onclick="playSong('${videoId}', \`${title}\`)">Play</button> <button onclick="downloadSong('${videoId}', \`${title}\`)">Download MP3</button></div></div>`;
        });
      } catch(err){ resultsDiv.innerHTML = 'Gagal: ' + err.message; }
    }

    function playSong(videoId, title) {
      player.style.display = 'block';
      songTitle.innerText = title;
      audio.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    }

    async function downloadSong(videoId, title) {
      alert('Sedang proses download...');
      const youtubeUrl = `https://www.youtube.com/watch?v=${videoId}`;
      const res = await fetch('https://api.cobalt.tools/api/json', {
        method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: youtubeUrl, aFormat: "mp3", isAudioOnly: true })
      });
      const data = await res.json();
      if(data.url) window.open(data.url, '_blank');
      else alert('Gagal: ' + data.error.code);
    }
    </script>
    </body>
    </html>
